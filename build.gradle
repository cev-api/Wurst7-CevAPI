fabricApi.configureTests {
	createSourceSet = true
	enableGameTests = false
	enableClientGameTests = true
	modId = "wurst_testmod"
	username = "Wurst-Bot"
}

loom {
	accessWidenerPath = file("src/main/resources/wurst.accesswidener")
	
	runs {
		clientGameTest {
			environment = "client"
			vmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
		}
		
		clientWithMods {
			environment = "client"
			inherit client
		}
		
		clientGameTestWithMods {
			environment = "client"
			inherit client
			runDir = "build/run/clientGameTestWithMods"
			vmArgs.add("-Dfabric.client.gametest")
			vmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
			vmArgs.add("-Dwurst.test.withMods=true")
			programArgs.add("--username=Wurst-Bot")
		}
	}
}

configurations {
	testMods {
		transitive = false
	}
}

def optionalCompatMods = [
	sodium: [artifact: "sodium", property: "sodium_version"],
	lootr: [artifact: "lootr", property: "lootr_version"],
	better_block_entities: [
		artifact: "better-block-entities",
		property: "better_block_entities_version"
	],
	badoptimizations: [
		artifact: "badoptimizations",
		property: "badoptimizations_version"
	],
	shoulder_surfing: [
		artifact: "shoulder-surfing-reloaded",
		property: "shoulder_surfing_version"
	],
	forge_config_api_port: [
		artifact: "forge-config-api-port",
		property: "forge_config_api_port_version"
	]
]

def compatModVersions = optionalCompatMods.collectEntries { id, mod ->
	[(id): providers.gradleProperty(mod.property).orElse("")]
}

dependencies {
	optionalCompatMods.each { id, mod ->
		def version = compatModVersions[id].get().trim()
		if(!version.isEmpty())
			testMods "maven.modrinth:${mod.artifact}:${version}"
	}
}

def hasCompatMods = providers.provider {
	compatModVersions.values().any { !it.get().trim().isEmpty() }
}

def cleanClientWithMods = tasks.register("cleanClientWithMods", Delete) {
	delete "run/mods"
}

def prepareClientWithMods = tasks.register("prepareClientWithMods", Sync) {
	from configurations.testMods
	into "run/mods"
}

tasks.named("runClientWithMods") {
	onlyIf { hasCompatMods.get() }
	dependsOn prepareClientWithMods
	finalizedBy cleanClientWithMods
}

def cleanClientGameTestWithMods = tasks.register("cleanClientGameTestWithMods", Delete) {
	delete layout.buildDirectory.dir("run/clientGameTestWithMods")
}

def prepareClientGameTestWithMods = tasks.register("prepareClientGameTestWithMods", Sync) {
	dependsOn cleanClientGameTestWithMods
	from configurations.testMods
	into layout.buildDirectory.dir("run/clientGameTestWithMods/mods")
}

tasks.named("runClientGameTestWithMods") {
	onlyIf { hasCompatMods.get() }
	dependsOn prepareClientGameTestWithMods
}

processResources {
	def modVersion = project.version.substring(1)
	inputs.property("version", modVersion)
	inputs.property("modName", modName)
	inputs.property("modDescription", modDescription)
	inputs.property("homepageUrl", homepageUrl)
	inputs.property("sourcesUrl", sourcesUrl)
	inputs.property("issuesUrl", issuesUrl)
	inputs.property("modId", modId)
	
	filesMatching("fabric.mod.json") {
		expand([
			modId: mainModId,
			version: modVersion,
			modName: modName,
			modDescription: modDescription,
			homepage: homepageUrl,
			sources: sourcesUrl,
			issues: issuesUrl
		])
	}
}

def buildConfigOutput =
	layout.buildDirectory.dir("generated/sources/buildConfig/java")

tasks.register("generateBuildConfig") {
	def template =
		file("src/main/templates/net/wurstclient/config/BuildConfig.java.in")
	def modVersionValue = project.mod_version
	def ghRepoId = project.gh_repo_id.toString()
	def ghRepoUrl = "https://github.com/${ghRepoId}"
	def buildDate = java.time.Instant.now().toString()
	
	inputs.file(template)
	inputs.property("niceWurstEnabled", niceWurstEnabled)
	inputs.property("forkReleaseVersion", forkReleaseVersion)
	inputs.property("ghRepoId", ghRepoId)
	inputs.property("ghRepoUrl", ghRepoUrl)
	inputs.property("buildDate", buildDate)
	outputs.dir(buildConfigOutput)
	
	doLast {
		def targetDir =
			buildConfigOutput.get().dir("net/wurstclient/config").asFile
		if(!targetDir.exists())
			targetDir.mkdirs()
		
		def content = template.getText("UTF-8")
			.replace('${NICE_WURST}', String.valueOf(niceWurstEnabled))
			.replace('${MOD_VERSION}', modVersionValue)
			.replace('${FORK_RELEASE_VERSION}', forkReleaseVersion)
			.replace('${BUILD_DATE}', buildDate)
			.replace('${GH_REPO_ID}', ghRepoId)
			.replace('${GH_REPO_URL}', ghRepoUrl)
		
		def targetFile = new File(targetDir, "BuildConfig.java")
		targetFile.setText(content, "UTF-8")
	}
}

sourceSets.main.java.srcDir(buildConfigOutput)

tasks.named("compileJava").configure {
	dependsOn(tasks.named("generateBuildConfig"))
}

tasks.configureEach {
	if(name == "sourcesJar" || name == "spotlessJava")
		dependsOn(tasks.named("generateBuildConfig"))
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.20.5 (24w14a) upwards uses Java 21.
	it.options.release = 21
	it.options.compilerArgs += "-Xlint:deprecation"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def archivesName = project.base.archivesName
	inputs.property("archivesName", archivesName)
	archiveVersion = "${project.version}_v${forkReleaseVersion}"
	
	from("LICENSE.txt") {
		rename { "LICENSE-${archivesName.get()}.txt" }
	}
	
	exclude("intentionally_untranslated.json")
}

tasks.named("remapJar") {
	archiveVersion = "${project.version}_v${forkReleaseVersion}"
}

import com.diffplug.spotless.generic.LicenseHeaderStep
spotless {
	lineEndings = "WINDOWS"
	java {
		targetExclude("build/generated/sources/buildConfig/java/**/*.java")
		removeUnusedImports()
		leadingSpacesToTabs()
		trimTrailingWhitespace()
		eclipse().configFile(file("codestyle/formatter.xml"))
	}
	format("licenseHeader") {
		target("src/*/java/**/*.java")
		def header_file = file("codestyle/license_header.txt")
		def delimiter = LicenseHeaderStep.DEFAULT_JAVA_HEADER_DELIMITER
		licenseHeaderFile(header_file, delimiter).updateYearWithLatest(true)
	}
	json {
		target("src/**/*.json", "src/**/*.mcmeta")
		gson().indentWithSpaces(2).version("2.11.0")
	}
}

def getGhVersion() {
	return version.substring(0, version.indexOf("-MC"))
}

def getChangelogLink(String platform, String from) {
	def versionSlug = getGhVersion().substring(1).replace(".", "-")
	def shortURL = "https://www.wurstclient.net/updates/wurst-${versionSlug}/"
	def query = []
	if (platform != "GitHub")
		query.add("mc=${project.minecraft_version}")
	query.add("utm_source=${platform}")
	query.add("utm_medium=" + project.archives_base_name.replace("-", "+"))
	def fullURL = shortURL + (query.isEmpty() ? "" : "?" + query.join("&"))
	def encodedURL = java.net.URLEncoder.encode(fullURL, "UTF-8")
	return "[${shortURL}](https://go.wimods.net/from/${from}?to=${encodedURL})"
}

def getChangelogImage(String from) {
	return "![](https://img.wimods.net/${from})"
}

def getChangelog(String platform, String from) {
	def prefix = platform == "GitHub" ? "" : "A changelog can be found at: "
	def imgQuery = platform == "GitHub" ? "" : "?mc_version=${project.minecraft_version}&mod_loader=${project.mod_loader}"
	return prefix + getChangelogLink(platform, from) + getChangelogImage(from + imgQuery)
}

import org.kohsuke.github.GHReleaseBuilder
import org.kohsuke.github.GitHub

task github(dependsOn: build) {
	onlyIf {
		ENV.GITHUB_TOKEN
	}
	
	doLast {
		def github = GitHub.connectUsingOAuth(ENV.GITHUB_TOKEN as String)
		def repoId = project.mcx_repo_id
		def repository = github.getRepository(repoId)
		def ghVersion = getGhVersion()
		
		def ghRelease = repository.getReleaseByTagName(ghVersion as String)
		if(ghRelease == null) {
			def releaseBuilder = new GHReleaseBuilder(repository, ghVersion as String)
			releaseBuilder.body(getChangelogImage("github.com/${repoId}/releases/tag/${ghVersion}"))
			releaseBuilder.prerelease(ghVersion.contains("pre"))
			ghRelease = releaseBuilder.create()
		}
		
		ghRelease.uploadAsset(remapJar.archiveFile.get().getAsFile(), "application/java-archive")
		ghRelease.uploadAsset(remapSourcesJar.archiveFile.get().getAsFile(), "application/java-archive")
	}
}

import org.kohsuke.github.GHIssueState
import org.kohsuke.github.GHMilestoneState
import java.time.Instant

task closeMilestone {
	onlyIf {
		ENV.GITHUB_TOKEN
	}
	
	doLast {
		def github = GitHub.connectUsingOAuth(ENV.GITHUB_TOKEN as String)
		def repoId = project.gh_repo_id
		def repository = github.getRepository(repoId)
		def ghVersion = getGhVersion()
		
		// Weird API design: listMilestones() requires GHIssueState while everything else uses GHMilestoneState.
		def milestone = repository.listMilestones(GHIssueState.ALL).find { it.title == ghVersion }
		if (milestone == null) {
			milestone = repository.createMilestone(ghVersion, "")
		}
		
		if (milestone.getState() != GHMilestoneState.CLOSED) {
			milestone.setDueOn(Date.from(Instant.now()))
			milestone.setDescription(getChangelog("GitHub", "github.com/${repoId}/milestone/${ghVersion}"))
			milestone.close()
		}
	}
}
